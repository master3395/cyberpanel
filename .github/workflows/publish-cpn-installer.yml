name: Publish CPN installer to Docker Hub

# One-shot / on-demand publisher for master3395/cpn-installer using this repo's
# existing DOCKERHUB_* secrets. Checks out CPN main and uses its Dockerfile +
# scripts/docker-build-rpm.sh (no parallel packaging).

on:
  workflow_dispatch:
    inputs:
      cpn_ref:
        description: CPN git ref (branch, tag, or SHA)
        required: false
        default: main
      os_tag:
        description: OS tag (almalinux9, almalinux10, or all)
        required: false
        default: all

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - alma: "9"
            tag: almalinux9
            latest: false
          - alma: "10"
            tag: almalinux10
            latest: true
    steps:
      - name: Optionally filter matrix
        id: want
        env:
          OS_TAG: ${{ github.event.inputs.os_tag }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          os_tag="${OS_TAG:-all}"
          if [ "${os_tag}" = "all" ] || [ "${os_tag}" = "${TAG}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout CPN
        if: steps.want.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: Control-Panel-Network/CPN-Control-Panel-Network
          ref: ${{ github.event.inputs.cpn_ref || 'main' }}

      - name: Set up Docker Buildx
        if: steps.want.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.want.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build RPM via scripts/docker-build-rpm.sh
        if: steps.want.outputs.run == 'true'
        env:
          CPN_ALMA_VERSION: ${{ matrix.alma }}
          CPN_CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail
          chmod +x scripts/docker-build-rpm.sh scripts/build-rpm.sh
          ./scripts/docker-build-rpm.sh
          shopt -s nullglob
          rpms=(target/rpmbuild/RPMS/*/cpn-installer-*.rpm)
          test "${#rpms[@]}" -ge 1
          cp -f "${rpms[0]}" ./cpn-installer.rpm
          ls -lh ./cpn-installer.rpm

      - name: Build and push master3395/cpn-installer
        if: steps.want.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            master3395/cpn-installer:${{ matrix.tag }}
            ${{ matrix.latest && 'master3395/cpn-installer:latest' || '' }}
          build-args: |
            ALMA_VERSION=${{ matrix.alma }}
          labels: |
            org.opencontainers.image.title=CPN Installer
            cpn.almalinux.version=${{ matrix.alma }}

      - name: Verify pull
        if: steps.want.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker pull "master3395/cpn-installer:${{ matrix.tag }}"
          docker run --rm --entrypoint /bin/bash \
            "master3395/cpn-installer:${{ matrix.tag }}" \
            -lc 'rpm -q cpn-installer && systemctl is-enabled cpn-installer.service'
